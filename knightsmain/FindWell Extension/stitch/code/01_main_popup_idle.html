<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Research Agent - Main</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#f7f9ff",
                        "surface-container-low": "#f1f4f9",
                        "on-tertiary-fixed-variant": "#474836",
                        "on-secondary-fixed-variant": "#394857",
                        "inverse-surface": "#2d3135",
                        "on-primary-container": "#a1cfcf",
                        "error": "#ba1a1a",
                        "tertiary": "#3b3d2c",
                        "on-secondary-container": "#556474",
                        "primary-container": "#2d5a5a",
                        "secondary": "#50606f",
                        "on-primary-fixed": "#002020",
                        "tertiary-fixed-dim": "#c8c8b0",
                        "on-surface": "#181c20",
                        "primary": "#124343",
                        "on-tertiary-fixed": "#1b1d0e",
                        "surface-tint": "#396666",
                        "surface-bright": "#f7f9ff",
                        "outline-variant": "#c0c8c7",
                        "inverse-primary": "#a1cfcf",
                        "on-secondary": "#ffffff",
                        "surface-container": "#ebeef3",
                        "tertiary-container": "#535442",
                        "surface": "#f7f9ff",
                        "secondary-fixed": "#d4e4f6",
                        "on-tertiary-container": "#c8c8b1",
                        "surface-container-highest": "#e0e3e8",
                        "inverse-on-surface": "#eef1f6",
                        "secondary-container": "#d1e1f4",
                        "tertiary-fixed": "#e4e4cc",
                        "surface-variant": "#e0e3e8",
                        "on-surface-variant": "#404848",
                        "on-primary": "#ffffff",
                        "outline": "#707978",
                        "primary-fixed": "#bcebeb",
                        "on-error-container": "#93000a",
                        "primary-fixed-dim": "#a1cfcf",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#b8c8da",
                        "surface-container-high": "#e5e8ed",
                        "surface-dim": "#d7dadf",
                        "on-primary-fixed-variant": "#204e4e",
                        "on-error": "#ffffff",
                        "on-background": "#181c20",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#0d1d2a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "md": "16px",
                        "item-gap": "12px",
                        "container-padding": "16px",
                        "sm": "8px",
                        "lg": "24px",
                        "xs": "4px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "h3": ["Manrope"],
                        "h1": ["Manrope"],
                        "label-sm": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "h2": ["Manrope"]
                    },
                    "fontSize": {
                        "h3": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "h1": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "body-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "h2": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d7dadf; border-radius: 9999px; }
        
        /* Toggle Switch CSS */
        .toggle-checkbox:checked { right: 0; border-color: #124343; }
        .toggle-checkbox:checked + .toggle-label { background-color: #124343; }
        .toggle-checkbox:checked + .toggle-label:after { transform: translateX(100%); border-color: white; }
    </style>
</head>
<body class="bg-surface-container-highest flex items-center justify-center min-h-screen">
<!-- Main Extension Container (400x600 constraint) -->
<div class="w-full max-w-[400px] h-[600px] bg-background relative flex flex-col overflow-hidden shadow-2xl ring-1 ring-outline-variant/50 sm:rounded-[24px]">
<!-- TopAppBar (Shared Component JSON injected styles) -->
<header class="bg-surface text-primary border-b border-outline-variant flex justify-between items-center w-full px-container-padding h-14 max-w-[400px] mx-auto z-10 sticky top-0">
<div class="font-h2 text-h2 text-primary tracking-tight">
                Research Agent
            </div>
<div class="flex items-center gap-sm">
<button aria-label="search" class="w-8 h-8 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="search" style="font-size: 20px;">search</span>
</button>
<button aria-label="settings" class="w-8 h-8 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="settings" style="font-size: 20px;">settings</span>
</button>
</div>
</header>
<!-- Scrollable Content Canvas -->
<main class="flex-1 overflow-y-auto px-container-padding py-lg pb-24 flex flex-col gap-lg">
<!-- Status & Headers -->
<div class="flex flex-col gap-sm">
<div class="inline-flex items-center gap-2 bg-surface-container-low border border-outline-variant/50 px-2 py-1 rounded-full w-max">
<div class="w-2 h-2 rounded-full bg-[#8DA399] animate-pulse"></div>
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Online</span>
</div>
<h1 class="font-h1 text-h1 text-on-surface mt-sm">Research anything</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Ask the agent to investigate a question or use the current page as context.</p>
</div>
<!-- Main Input Card (Tactile, minimal elevation) -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col gap-md transition-all focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/10">
<textarea class="w-full bg-transparent border-none p-0 focus:ring-0 resize-none h-24 font-body-md text-body-md text-on-surface placeholder:text-outline" placeholder="What would you like me to research?"></textarea>
<div class="flex items-center justify-between pt-sm border-t border-surface-container-high">
<label class="flex items-center gap-sm cursor-pointer group">
<div class="relative">
<!-- Input -->
<input class="sr-only" type="checkbox">
<!-- Track -->
<div class="block bg-surface-variant w-10 h-6 rounded-full transition-colors group-hover:bg-outline-variant"></div>
<!-- Dot -->
<div class="dot absolute left-1 top-1 bg-surface-container-lowest w-4 h-4 rounded-full transition transform"></div>
</div>
<span class="font-body-sm text-body-sm text-secondary">Use current page</span>
</label>
<button class="bg-primary text-on-primary font-label-md text-label-md px-md py-2 rounded-lg hover:bg-surface-tint active:scale-95 transition-all flex items-center gap-xs">
<span class="material-symbols-outlined" data-icon="auto_awesome" style="font-size: 16px;">auto_awesome</span>
                        Research this
                    </button>
</div>
</div>
<!-- Empty State -->
<div class="flex-1 flex flex-col items-center justify-center text-center gap-sm opacity-60 mt-xl">
<span class="material-symbols-outlined text-outline" data-icon="data_exploration" style="font-size: 32px; font-variation-settings: 'wght' 200;">data_exploration</span>
<span class="font-body-sm text-body-sm text-secondary">Ready to research</span>
</div>
</main>
<!-- BottomNavBar (Shared Component JSON injected styles) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 py-2 bg-surface border-t border-outline-variant max-w-[400px]">
<!-- Active Tab -->
<button class="flex flex-col items-center justify-center text-primary font-bold w-full py-1 hover:bg-surface-container-low transition-colors rounded-lg active:scale-95 duration-150">
<span class="material-symbols-outlined mb-1" data-icon="add_circle" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-label-md text-label-md">New Research</span>
</button>
<!-- Inactive Tab -->
<button class="flex flex-col items-center justify-center text-on-surface-variant w-full py-1 hover:bg-surface-container-low transition-colors rounded-lg active:scale-95 duration-150">
<span class="material-symbols-outlined mb-1" data-icon="library_books">library_books</span>
<span class="font-label-md text-label-md">Library</span>
</button>
<!-- Inactive Tab -->
<button class="flex flex-col items-center justify-center text-on-surface-variant w-full py-1 hover:bg-surface-container-low transition-colors rounded-lg active:scale-95 duration-150">
<span class="material-symbols-outlined mb-1" data-icon="history">history</span>
<span class="font-label-md text-label-md">History</span>
</button>
</nav>
</div>
<script>
        // Simple toggle interaction for visual feedback
        const toggleInput = document.querySelector('input[type="checkbox"]');
        const toggleTrack = toggleInput.nextElementSibling;
        const toggleDot = toggleTrack.nextElementSibling;
        const toggleLabelText = toggleInput.parentElement.nextElementSibling;

        toggleInput.addEventListener('change', (e) => {
            if(e.target.checked) {
                toggleTrack.classList.remove('bg-surface-variant');
                toggleTrack.classList.add('bg-primary');
                toggleDot.classList.add('translate-x-4');
                toggleLabelText.classList.remove('text-secondary');
                toggleLabelText.classList.add('text-primary');
            } else {
                toggleTrack.classList.add('bg-surface-variant');
                toggleTrack.classList.remove('bg-primary');
                toggleDot.classList.remove('translate-x-4');
                toggleLabelText.classList.add('text-secondary');
                toggleLabelText.classList.remove('text-primary');
            }
        });
    </script>
</body></html>
