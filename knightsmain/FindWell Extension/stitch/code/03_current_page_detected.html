        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;

<body class="bg-background text-on-surface h-screen w-full flex justify-center items-center overflow-hidden">
<!-- Extension Container -->
<div class="w-[400px] h-[600px] bg-background relative flex flex-col shadow-2xl rounded-xl overflow-hidden border border-outline-variant">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-container-padding h-14 max-w-[400px] mx-auto bg-surface border-b border-outline-variant z-10 shrink-0">
<h2 class="font-h2 text-h2 text-primary tracking-tight">Research Agent</h2>
<div class="flex items-center gap-md text-on-surface-variant">
<button class="hover:bg-surface-container-high transition-colors p-sm rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
<button class="hover:bg-surface-container-high transition-colors p-sm rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto p-container-padding flex flex-col gap-lg bg-surface-bright pb-24">
<!-- Current Page Context Card -->
<section class="flex flex-col gap-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Current Page Context</span>
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-md flex flex-col gap-md relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-br from-surface-tint/5 to-transparent pointer-events-none"></div>
<!-- Page Info -->
<div class="flex items-start gap-md relative z-10">
<div class="w-10 h-10 rounded bg-surface-container flex items-center justify-center shrink-0 border border-outline-variant overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A stylized, minimalist 3D icon representing a generic website favicon, specifically an open book or document, rendered in subtle pale greens and cool grays on a light background. High-quality professional design suitable for a modern AI research tool interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDMWW63rOViBR0HETCa_y1bsdpe3yjRqoWa5vCtZS7J3-oblAqB5t4xb3pfB2jmY4NACSVavhOdWHCYlT8v76mP6MgRGFQe8q28u1mb7MWzwEhARziNl8YrxVOQ09iufcDF5m64PVkci8qPyDU2BAuxQ-V9EGDtdHaPZZ85ZnzY5mItNnePlmhRjbgWxmB6LRHNcCXnnTEmmpG8OIN8c82SNf4vr1-We3P-FhSTj36I3oc0QDRvT0R3">
</div>
<div class="flex flex-col flex-1 min-w-0">
<h3 class="font-h3 text-h3 text-on-surface truncate">AI Research Article</h3>
<span class="font-body-sm text-body-sm text-secondary truncate">example.com</span>
</div>
<span class="material-symbols-outlined text-[#8DA399]" data-icon="check_circle" data-weight="fill">check_circle</span>
</div>
<!-- Context Actions -->
<div class="flex items-center gap-sm mt-xs relative z-10">
<button class="flex-1 bg-surface-container-high hover:bg-surface-variant text-on-surface border border-outline-variant rounded-lg py-sm px-md font-label-md text-label-md transition-colors flex justify-center items-center gap-xs">
<span class="material-symbols-outlined text-[16px]" data-icon="quick_reference_all">quick_reference_all</span>
                            Research this page
                        </button>
<button class="flex-1 bg-surface-container-high hover:bg-surface-variant text-on-surface border border-outline-variant rounded-lg py-sm px-md font-label-md text-label-md transition-colors flex justify-center items-center gap-xs">
<span class="material-symbols-outlined text-[16px]" data-icon="library_add">library_add</span>
                            Use as source
                        </button>
</div>
</div>
</section>
<!-- Main Input Area -->
<section class="flex flex-col gap-base mt-auto">
<!-- Toggle Context -->
<div class="flex items-center justify-between py-sm px-md bg-[#F5F5DC]/30 border border-outline-variant rounded-lg">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-[18px]" data-icon="link">link</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Current page will be included as context.</span>
</div>
<!-- Toggle Switch ON -->
<button class="w-10 h-5 bg-primary rounded-full relative transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-1">
<div class="absolute right-0.5 top-0.5 w-4 h-4 bg-white rounded-full shadow-sm transition-transform duration-200"></div>
</button>
</div>
<!-- Query Input -->
<div class="relative w-full group">
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-md pr-12 font-body-md text-body-md text-on-surface placeholder-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/10 transition-all resize-none min-h-[100px]" placeholder="Ask a question about this page or start new research..."></textarea>
<!-- Send Button -->
<button class="absolute bottom-md right-md bg-primary hover:bg-primary-container text-white p-2 rounded-lg transition-colors flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[20px]" data-icon="send">send</span>
</button>
</div>
<!-- Suggestions -->
<div class="flex flex-wrap gap-sm">
<button class="bg-[#F5F5DC] text-[#2F3337] border border-outline-variant rounded-md px-sm py-1 font-body-sm text-body-sm hover:bg-[#ebebce] transition-colors">Summarize key findings</button>
<button class="bg-[#F5F5DC] text-[#2F3337] border border-outline-variant rounded-md px-sm py-1 font-body-sm text-body-sm hover:bg-[#ebebce] transition-colors">Fact-check claims</button>
</div>
</section>
</main>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 py-2 bg-surface border-t border-outline-variant max-w-[400px] mx-auto pb-6">

<span class="material-symbols-outlined mb-1" data-icon="add_circle" data-weight="fill">add_circle</span>
<span class="font-label-md text-label-md">New Research</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low rounded-lg w-full py-sm transition-colors" href="#">
<span class="material-symbols-outlined mb-1" data-icon="library_books">library_books</span>
<span class="font-label-md text-label-md">Library</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low rounded-lg w-full py-sm transition-colors" href="#">
<span class="material-symbols-outlined mb-1" data-icon="history">history</span>
<span class="font-label-md text-label-md">History</span>
</a>
</nav>
</div>
