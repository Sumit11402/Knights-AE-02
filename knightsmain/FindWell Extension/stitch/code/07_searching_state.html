<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Research Agent - Searching</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&amp;family=Inter:wght@400..600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "background": "#f7f9ff",
                "surface-container-low": "#f1f4f9",
                "on-tertiary-fixed-variant": "#474836",
                "on-secondary-fixed-variant": "#394857",
                "inverse-surface": "#2d3135",
                "on-primary-container": "#a1cfcf",
                "error": "#ba1a1a",
                "tertiary": "#3b3d2c",
                "on-secondary-container": "#556474",
                "primary-container": "#2d5a5a",
                "secondary": "#50606f",
                "on-primary-fixed": "#002020",
                "tertiary-fixed-dim": "#c8c8b0",
                "on-surface": "#181c20",
                "primary": "#124343",
                "on-tertiary-fixed": "#1b1d0e",
                "surface-tint": "#396666",
                "surface-bright": "#f7f9ff",
                "outline-variant": "#c0c8c7",
                "inverse-primary": "#a1cfcf",
                "on-secondary": "#ffffff",
                "surface-container": "#ebeef3",
                "tertiary-container": "#535442",
                "surface": "#f7f9ff",
                "secondary-fixed": "#d4e4f6",
                "on-tertiary-container": "#c8c8b1",
                "surface-container-highest": "#e0e3e8",
                "inverse-on-surface": "#eef1f6",
                "secondary-container": "#d1e1f4",
                "tertiary-fixed": "#e4e4cc",
                "surface-variant": "#e0e3e8",
                "on-surface-variant": "#404848",
                "on-primary": "#ffffff",
                "outline": "#707978",
                "primary-fixed": "#bcebeb",
                "on-error-container": "#93000a",
                "primary-fixed-dim": "#a1cfcf",
                "on-tertiary": "#ffffff",
                "secondary-fixed-dim": "#b8c8da",
                "surface-container-high": "#e5e8ed",
                "surface-dim": "#d7dadf",
                "on-primary-fixed-variant": "#204e4e",
                "on-error": "#ffffff",
                "on-background": "#181c20",
                "error-container": "#ffdad6",
                "surface-container-lowest": "#ffffff",
                "on-secondary-fixed": "#0d1d2a"
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
        },
        "spacing": {
                "base": "8px",
                "md": "16px",
                "item-gap": "12px",
                "container-padding": "16px",
                "sm": "8px",
                "lg": "24px",
                "xs": "4px",
                "xl": "32px"
        },
        "fontFamily": {
                "h3": ["Manrope"],
                "h1": ["Manrope"],
                "label-sm": ["Inter"],
                "body-sm": ["Inter"],
                "label-md": ["Inter"],
                "body-md": ["Inter"],
                "body-lg": ["Inter"],
                "h2": ["Manrope"]
        },
        "fontSize": {
                "h3": ["16px", {"lineHeight": "24px", "fontWeight": "600"}],
                "h1": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "500"}],
                "body-sm": ["12px", {"lineHeight": "18px", "fontWeight": "400"}],

                "h2": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}]

      },
    },
  }

<style>
  @keyframes subtle-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.05); }
  }
  .animate-subtle-pulse {
    animation: subtle-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }
  .skeleton {
    background-color: #E8ECE9;
    border-radius: 4px;
    animation: pulse-skeleton 1.5s ease-in-out infinite alternate;
  }
  @keyframes pulse-skeleton {
    0% { opacity: 0.5; }
    100% { opacity: 1; }
  }
</style>
</head>
<body class="bg-background text-on-surface h-screen flex justify-center items-center font-body-md">
<div class="w-full max-w-[400px] h-full max-h-[600px] bg-[#FDFDFB] border border-outline-variant rounded-lg flex flex-col relative overflow-hidden shadow-[0px_4px_12px_rgba(47,51,55,0.08)]">
<!-- TopAppBar (Transactional - Hidden Navigation Shells per prompt) -->
<header class="bg-[#FDFDFB] border-b border-outline-variant flex justify-between items-center w-full px-container-padding h-14 shrink-0">
<div class="flex items-center gap-2">
<span class="font-h3 text-h3 text-primary animate-subtle-pulse flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">motion_sensor_active</span>
           RESEARCHING
        </span>
</div>
<button aria-label="Minimize" class="text-on-surface-variant hover:bg-surface-container-high transition-colors rounded-full p-1">
<span class="material-symbols-outlined text-[20px]">minimize</span>
</button>
</header>
<main class="flex-1 overflow-y-auto px-container-padding py-lg flex flex-col gap-lg">
<!-- Current Query Context -->
<section>
<h1 class="font-h2 text-h2 text-on-surface mb-xs">Impact of AI on Healthcare Diagnostics</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Gathering peer-reviewed papers from 2022-2024</p>
</section>
<!-- Progress Timeline -->
<section class="bg-[#E8ECE9] border border-outline-variant rounded-lg p-md">
<div class="flex flex-col gap-sm relative">
<!-- Timeline Track -->
<div class="absolute left-[11px] top-[14px] bottom-[14px] w-[2px] bg-outline-variant z-0"></div>
<!-- Step 1: Planning (Done) -->
<div class="flex items-start gap-md relative z-10">
<div class="w-6 h-6 rounded-full bg-[#8DA399] flex items-center justify-center shrink-0 mt-[2px]">
<span class="material-symbols-outlined text-white text-[14px] font-bold">check</span>
</div>
<div>
<p class="font-label-md text-label-md text-on-surface">Planning</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Formulated search strategy</p>
</div>
</div>
<!-- Step 2: Searching (Active) -->
<div class="flex items-start gap-md relative z-10">
<div class="w-6 h-6 rounded-full border-2 border-primary bg-primary flex items-center justify-center shrink-0 mt-[2px] animate-subtle-pulse">
<div class="w-2 h-2 rounded-full bg-white"></div>
</div>
<div>
<p class="font-label-md text-label-md text-primary font-bold">Searching</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Finding relevant sources across databases</p>
</div>
</div>
<!-- Step 3: Verifying (Upcoming) -->
<div class="flex items-start gap-md relative z-10 opacity-60">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant bg-[#FDFDFB] shrink-0 mt-[2px]"></div>
<div>
<p class="font-label-md text-label-md text-on-surface-variant">Verifying</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Checking evidence and claims</p>
</div>
</div>
<!-- Step 4: Done (Upcoming) -->
<div class="flex items-start gap-md relative z-10 opacity-40">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant bg-[#FDFDFB] shrink-0 mt-[2px]"></div>
<div>
<p class="font-label-md text-label-md text-on-surface-variant">Done</p>
</div>
</div>
</div>
</section>
<!-- Incoming Data Skeletons -->
<section class="flex flex-col gap-sm mt-sm">
<h3 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-xs">Incoming Sources</h3>
<div class="border border-outline-variant rounded-lg p-sm bg-[#FDFDFB] flex items-center gap-md opacity-70">
<div class="w-10 h-10 rounded skeleton shrink-0"></div>
<div class="flex-1 flex flex-col gap-2">
<div class="h-3 w-3/4 skeleton"></div>
<div class="h-2 w-1/2 skeleton"></div>
</div>
</div>
<div class="border border-outline-variant rounded-lg p-sm bg-[#FDFDFB] flex items-center gap-md opacity-40">
<div class="w-10 h-10 rounded skeleton shrink-0"></div>
<div class="flex-1 flex flex-col gap-2">
<div class="h-3 w-2/3 skeleton"></div>
<div class="h-2 w-1/3 skeleton"></div>
</div>
</div>
</section>
</main>
<!-- Contextual Action (Cancel) -->
<footer class="p-container-padding pt-0 shrink-0">
<button class="w-full py-2 px-4 rounded-[12px] bg-[#E8ECE9] text-[#2F3337] border border-[#D1D9D4] font-label-md text-label-md hover:bg-surface-container-highest transition-colors">
            Cancel Search
        </button>
</footer>
</div>
</body></html>
