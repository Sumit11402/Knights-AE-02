<!DOCTYPE html><html class="h-full" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Research Agent - Error</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#f7f9ff",
                        "surface-container-low": "#f1f4f9",
                        "on-tertiary-fixed-variant": "#474836",
                        "on-secondary-fixed-variant": "#394857",
                        "inverse-surface": "#2d3135",
                        "on-primary-container": "#a1cfcf",
                        "error": "#ba1a1a",
                        "tertiary": "#3b3d2c",
                        "on-secondary-container": "#556474",
                        "primary-container": "#2d5a5a",
                        "secondary": "#50606f",
                        "on-primary-fixed": "#002020",
                        "tertiary-fixed-dim": "#c8c8b0",
                        "on-surface": "#181c20",
                        "primary": "#124343",
                        "on-tertiary-fixed": "#1b1d0e",
                        "surface-tint": "#396666",
                        "surface-bright": "#f7f9ff",
                        "outline-variant": "#c0c8c7",
                        "inverse-primary": "#a1cfcf",
                        "on-secondary": "#ffffff",
                        "surface-container": "#ebeef3",
                        "tertiary-container": "#535442",
                        "surface": "#f7f9ff",
                        "secondary-fixed": "#d4e4f6",
                        "on-tertiary-container": "#c8c8b1",
                        "surface-container-highest": "#e0e3e8",
                        "inverse-on-surface": "#eef1f6",
                        "secondary-container": "#d1e1f4",
                        "tertiary-fixed": "#e4e4cc",
                        "surface-variant": "#e0e3e8",
                        "on-surface-variant": "#404848",
                        "on-primary": "#ffffff",
                        "outline": "#707978",
                        "primary-fixed": "#bcebeb",
                        "on-error-container": "#93000a",
                        "primary-fixed-dim": "#a1cfcf",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#b8c8da",
                        "surface-container-high": "#e5e8ed",
                        "surface-dim": "#d7dadf",
                        "on-primary-fixed-variant": "#204e4e",
                        "on-error": "#ffffff",
                        "on-background": "#181c20",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#0d1d2a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "md": "16px",
                        "item-gap": "12px",
                        "container-padding": "16px",
                        "sm": "8px",
                        "lg": "24px",
                        "xs": "4px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "h3": ["Manrope"],
                        "h1": ["Manrope"],
                        "label-sm": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "h2": ["Manrope"]
                    },
                    "fontSize": {
                        "h3": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "h1": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "body-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "h2": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Subtle pulse for the error icon to make it feel alive but not alarming */
        @keyframes subtle-pulse {
            0% { opacity: 0.8; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(0.98); }
        }
        .animate-subtle-pulse {
            animation: subtle-pulse 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-background text-on-background h-full flex flex-col items-center justify-center font-body-md antialiased overflow-hidden selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Main Extension Container -->
<main class="w-full max-w-[400px] h-full max-h-[600px] bg-background relative flex flex-col">
<!-- TopAppBar (Suppressed for Error State Canvas Focus, but keeping a minimal header for context) -->
<header class="flex justify-between items-center w-full px-container-padding h-14 border-b border-outline-variant bg-surface flat no shadows">
<h1 class="font-h3 text-h3 text-primary font-bold">Research Agent</h1>
<button aria-label="Close" class="text-on-surface-variant hover:bg-surface-container-high transition-colors p-2 rounded-full">
<span aria-hidden="true" class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Error Content Canvas -->
<div class="flex-1 flex flex-col items-center justify-center px-container-padding py-xl text-center">
<!-- Icon Container -->
<div class="w-24 h-24 rounded-full bg-error-container flex items-center justify-center mb-lg animate-subtle-pulse">
<span aria-hidden="true" class="material-symbols-outlined text-[48px] text-on-error-container">cloud_off</span>
</div>
<!-- Typography -->
<h2 class="font-h2 text-h2 text-on-surface mb-sm">Research couldn't be completed</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mb-xl">
                Something went wrong while connecting to the research agent.
            </p>
<!-- Actions -->
<div class="flex flex-col w-full gap-md max-w-[280px]">
<button class="w-full h-12 bg-primary-container text-on-primary rounded-xl font-label-md text-label-md flex items-center justify-center transition-transform hover:scale-[0.98] active:scale-95">
                    Try again
                </button>
<button class="w-full h-12 bg-surface-container-low text-inverse-surface border border-outline-variant rounded-xl font-label-md text-label-md flex items-center justify-center transition-colors hover:bg-surface-container-high">
                    Open web app
                </button>
</div>
</div>
</main>
</body></html>
