name: findwell_app
description: "FindWell — Secure, Self-Evolving Autonomous Research & Computer-Use Agent."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Navigation
  go_router: ^14.8.1
  
  # HTTP client
  dio: ^5.7.0
  
  # Local & Cloud Storage
  supabase_flutter: ^2.8.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_secure_storage: ^9.2.4
  
  # Markdown rendering
  flutter_markdown: any
  
  # Fonts
  google_fonts: ^6.2.1
  
  # Animations
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  animated_text_kit: ^4.2.2
  
  # File picker
  file_picker: ^8.1.4

  # Sharing / Export
  share_plus: ^10.1.4
  
  # XML parsing (arXiv Atom feed)
  xml: ^6.5.0
  
  # UUID
  uuid: ^4.5.1
  
  # URL launcher
  url_launcher: ^6.3.1
  
  # Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/icons/
